    --bg: #161B24; --surface: #1F2531; --ink: #E7EAF0; --muted: #9AA4B5; --line: #333C4C;
    --keys: #4FB8B1; --analog: #8C9CF0; --digital: #C58AC8; --own: #E0AA55; --focus: #E7EAF0;

    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-stretch: 112%; font-weight: 500;
    font-size: 14px; color: var(--muted); border-left: 3px solid var(--c); padding-left: 10px;
    margin-bottom: 14px; max-width: 64ch;

  .links { margin-bottom: 18px !important; font-size: 16px; }
  .links a { color: var(--ink); text-decoration-color: var(--c); text-decoration-thickness: 2px; text-underline-offset: 3px; }

  .empty { padding: 40px 0; color: var(--muted); }

  @media (max-width: 560px) {
    body { font-size: 17px; }
    .head { grid-template-columns: 70px 1fr 16px; gap: 10px; padding: 12px; }

    .year.small { font-size: 14px; }
    .name { font-size: 16px; }
    .body > div > * { margin-left: 92px; margin-right: 12px; }

<body>
<main class="wrap">
  <h1>Where Arturia's instruments came from</h1>
  <p class="lede">Most of Arturia's instruments recreate a real one, and a few are Arturia's own designs. Tap any entry for the story of the original, how it sounded and what it was used for. The year is when the original arrived.</p>

  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Search by name, maker or year" aria-label="Search instruments" autocomplete="off">
    <div class="row-controls">
      <div class="chips" id="chips" role="group" aria-label="Filter by group"></div>
      <div class="seg" id="sort" role="group" aria-label="Sort order">
        <button type="button" data-sort="type" aria-pressed="true">By group</button>
        <button type="button" data-sort="year" aria-pressed="false">Oldest first</button>
      </div>
    </div>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="list"></div>
</main>

<script>
const CATS = {
  keys:    { label: "Keys", note: "Pianos, electric pianos, organs and tape or string keyboards." },
  analog:  { label: "Analog synths", note: "Monosynths, polysynths, modulars, a bass machine and a vocoder." },
  digital: { label: "Digital and sampling", note: "FM, phase distortion, wavetable and sampling instruments." },
  own:     { label: "Arturia's own", note: "Instruments that started with Arturia rather than a vintage original." }
};

const DATA = [
  // ---------- KEYS ----------
  { n:"Piano V", cat:"keys", y:1700, yl:"c. 1700", o:"Acoustic grand and upright pianos", m:"Bartolomeo Cristofori, Florence",
    a:{t:'grand',b:'#151517'},
    t:"Around 1700, Bartolomeo Cristofori, keeper of instruments at the Medici court in Florence, built the first piano. He called it a gravicembalo col piano e forte, a harpsichord with soft and loud. A harpsichord plucks its strings at one fixed volume, but his hammer action let a player shape every note by touch. The idea spread slowly at first. In the 1800s iron frames, heavier strings and Sébastien Érard's double-escapement action made pianos louder and far more responsive, and firms such as Steinway & Sons, founded in New York in 1853, and Yamaha, which built its first piano in Japan in 1900, settled the form of the concert grand and the upright.",
    s:"The acoustic piano has been the foundation of Western keyboard music for three centuries, and its influence runs from Beethoven to modern hip-hop production. Every piano has its own voice, from bright and cutting to round and dark, which is why makers, halls and even individual instruments are talked about the way singers are. For most producers a convincing piano is the first sound they reach for when writing chords." },
  { n:"CP-70 V", cat:"keys", y:1976, yl:"1976", o:"Yamaha CP-70 electric grand", m:"Yamaha",
    a:{t:'grand',b:'#1f1f22',small:true},
    f:"73 keys · real strings and hammers · pickups and onboard tone controls",
    t:"Electric pianos of the 1970s solved a real stage problem. An acoustic piano is quiet, hard to amplify without feedback and prone to drifting out of tune when it is moved. Yamaha's answer, introduced in 1976, was the CP-70, a compact electric grand that kept real strings and a real hammer action but added pickups and tone controls so it could be plugged into a PA. The CP-80 followed in 1979 with a wider key range.",
    s:"The sound is clear, bright and slightly percussive. It is closer to an acoustic grand than a Rhodes or a Wurlitzer, but tighter and more focused, which helped it cut through dense band mixes. It was a fixture on touring stages in the late 1970s and 1980s, particularly for pop and rock keyboardists who wanted a piano tone that survived a loud stage." },
  { n:"Stage-73 V", cat:"keys", y:1970, yl:"1970", o:"Fender Rhodes Stage 73", m:"Harold Rhodes / Fender",
    a:{t:'kbd',b:'#151515',p:'#b9bdc4',ph:30,w:30},
    f:"73 keys · steel tines with electromagnetic pickups",
    t:"Harold Rhodes, a pianist and teacher, began building small keyboards during the Second World War for injured servicemen to play in hospital beds. After the war he refined the idea into an electric piano in which each key swings a hammer against a small tuned steel tine, with an electromagnetic pickup close by, much like an electric guitar's. He worked with Leo Fender's company from the late 1950s, and after CBS bought Fender in 1965 the instrument was sold as the Fender Rhodes. The Stage 73, a 73-key portable model, arrived in 1970 and went on the road with countless bands.",
    s:"The Rhodes tone is soft and bell-like when played gently and grows a growling bark when played hard, and it has a natural tremolo when run through stereo amps. It defined the sound of jazz fusion and soul in the 1970s, from Herbie Hancock and Chick Corea to Donny Hathaway, and it remains a staple of neo-soul, R&B and hip-hop production." },
  { n:"Wurli V", cat:"keys", y:1954, yl:"1954", o:"Wurlitzer electric piano (200 series)", m:"Wurlitzer",
    a:{t:'kbd',b:'#2e2e33',p:'#8a8d94',ph:44,sw:[6,'#d0503a'],w:26},
    f:"64 keys (200 series) · steel reeds struck by hammers",
    t:"Wurlitzer, a company best known for jukeboxes and theatre organs, began selling electric pianos in 1954, building on ideas by Benjamin Miessner, who had experimented with electrified pianos in the 1930s. The first models were sold as compact teaching pianos for classrooms and were built to be cheap and tough. The design was refined through the 1960s, and from 1968 the 200 series brought a more modern look. The 200A of 1974 is the version most people picture.",
    s:"Each key hits a small steel reed, and its vibration is picked up electrostatically. Played softly, a Wurlitzer sounds mellow and woody. Played hard, it barks and distorts, and that character is the whole appeal. You can hear it on records from Ray Charles's What'd I Say to Supertramp's Dreamer." },
  { n:"Clavinet V", cat:"keys", y:1964, yl:"1964", o:"Hohner Clavinet", m:"Hohner",
    a:{t:'kbd',b:'#161616',p:'#333338',ph:52,sw:[5,'#e8e2d0'],w:26},
    f:"60 keys (D6) · strings pressed against a metal anvil",
    h:"Stevie Wonder's Superstition (1972) made the D6 famous.",
    t:"Ernst Zacharias, an engineer at the German accordion and harmonica maker Hohner, designed a family of electric keyboards in the 1960s, and the Clavinet was one of them. It is essentially an electric clavichord. Pressing a key drives a small rubber-tipped piece that pins a string against a metal anvil, and pickups like those on a guitar catch the sound. It launched in 1964 as the Clavinet I, and the D6 of 1971, with its bank of tone switches, became the definitive model.",
    s:"The short, plucked attack and tight decay make the Clavinet ideal for rhythmic playing, and it is inseparable from 1970s funk. It also turns up in disco, reggae and rock, including John Paul Jones's part on Led Zeppelin's Trampled Under Foot. Run through a wah pedal it becomes even more percussive." },
  { n:"B-3 V", cat:"keys", y:1954, yl:"1954", o:"Hammond B-3 organ", m:"Hammond Organ Company",
    a:{t:'organ'},
    f:"Two 61-note manuals · nine drawbars per manual · tonewheel generator",
    h:"Jimmy Smith made it a lead jazz instrument in the 1950s.",
    t:"Laurens Hammond built his first tonewheel organ in Chicago in 1935. It made sound electrically by spinning metal tonewheels in front of pickups rather than blowing air through pipes, which made it small and cheap enough for homes and churches. The B-3, introduced in 1954, is the version that became legend: two 61-note keyboards, a pedalboard, nine drawbars per manual for mixing harmonics, plus percussion and vibrato. Don Leslie's rotating speaker cabinet, developed in the 1940s, added the characteristic swirl.",
    s:"Drawbars let a player build a sound by ear, from a pure flute to a full, growling roar, and switching the Leslie between slow and fast is one of the most recognisable gestures in music. After jazz players adopted it, the B-3 became central to gospel, soul, blues and rock." },
  { n:"Farfisa V", cat:"keys", y:1964, yl:"1960s", o:"Farfisa combo organs", m:"Farfisa, Italy",
    a:{t:'kbd',b:'#2b3a67',p:'#d8d2c0',ph:44,sw:[10,'#e6c34a'],w:24,rev:true,legs:true},
    t:"Farfisa started in 1946 in the Marche region of Italy as an accordion maker. By the early 1960s it was building compact transistor organs for touring bands. They were portable, affordable and far lighter than a Hammond, and many came with a folding stand and rows of coloured tabs for switching voices.",
    s:"The Farfisa sound is thin, buzzy and slightly nasal, and it cuts through a guitar band. It found its way into 1960s garage rock and psychedelia, and was picked up again by new wave bands later on." },
  { n:"Vox Continental V", cat:"keys", y:1962, yl:"1962", o:"Vox Continental", m:"Jennings Musical Industries, England",
    a:{t:'kbd',b:'#1a1a1c',p:'#26262a',ph:44,sw:[9,'#e8e2cf'],w:24,rev:true,legs:true},
    f:"49 keys · transistor organ",
    h:"Heard on The Animals' House of the Rising Sun.",
    t:"Jennings Musical Industries, the English company behind Vox amplifiers, released the Continental in 1962. It was a portable organ built with transistors rather than valves, with a single 49-key manual. Compact and cheap compared with a Hammond, it was far easier to load into a van, which made it a natural choice for touring beat groups in the British Invasion era.",
    s:"Bright and a little raspy, the Continental has a distinctive sizzle, especially in its upper registers. It became a signature sound of 1960s pop and garage rock and was famously used by The Doors' Ray Manzarek." },
  { n:"Mellotron V", cat:"keys", y:1963, yl:"1963", o:"Mellotron", m:"Streetly Electronics, Birmingham",
    a:{t:'mello'},
    f:"35 keys (M400) · one tape strip per key",
    h:"The Beatles used it on Strawberry Fields Forever.",
    t:"The Mellotron's ancestor was the Chamberlin, built in California by Harry Chamberlin from the 1940s: a keyboard where each key played back a length of recorded tape. English brothers Bill, Frank and Norman Bradley of Streetly Electronics in Birmingham developed the idea into the Mellotron, and the first models appeared in 1963. Each key holds a tape strip of a real instrument, such as flute, cello or a choir, recorded note by note, and the tape is pulled back by a spring on release. The M400 of 1970 became the portable workhorse.",
    s:"The eerie, slightly wobbly tone comes from the tape mechanism. Notes run out after about eight seconds, so players learn to work in phrases. The Beatles put a Mellotron flute at the start of Strawberry Fields Forever, and the instrument became a signature of King Crimson, Genesis and other progressive rock bands." },
  { n:"Solina V", cat:"keys", y:1974, yl:"1974", o:"Solina String Ensemble", m:"Eminent, Netherlands / ARP",
    a:{t:'kbd',b:'#2c2c30',c:'#8a5a2e',p:'#c8c3b4',ph:70,sl:[12,'#f0f0f0'],w:26},
    t:"In the early 1970s the Dutch company Eminent began building string sounds into its organs and then spun the idea off into a dedicated instrument, the Solina String Ensemble. It used divide-down electronics, in which a single high-frequency generator is divided to make every note at once, and it ran the result through an ensemble effect. In the United States it was sold as the ARP String Ensemble from 1974, and it made a polyphonic string sound affordable for the first time.",
    s:"The wide, slowly shimmering ensemble effect gave a lush string-section sound that sat behind countless 1970s records. It defined the sound of disco strings and the wide pads of soft rock and pop." },

  // ---------- ANALOG ----------
  { n:"Modular V", cat:"analog", y:1964, yl:"1964", o:"Moog modular synthesizer", m:"R.A. Moog Co., New York",
    a:{t:'modular'},
    t:"Robert Moog began building voltage-controlled synthesizer modules in Trumansburg, New York, in the early 1960s, working with musicians such as composer Herb Deutsch. He showed them at the Audio Engineering Society convention in 1964, and orders followed. A Moog modular is built from separate oscillators, filters, envelope generators and amplifiers, connected by patch cables, and voltage controls how each one behaves. Any module can control any other.",
    s:"Building a sound means patching it by hand, which invites experiment. Wendy Carlos's Switched-On Bach (1968) proved the modular could play convincing music and became a bestselling classical album. The instrument went on to shape progressive rock and film music, from Keith Emerson's stage rig to the score of A Clockwork Orange." },
  { n:"Mini V", cat:"analog", y:1970, yl:"1970", o:"Minimoog Model D", m:"Moog Music",
    a:{t:'kbd',b:'#141414',c:'#8a5528',p:'#1b1b1e',ph:76,knobs:[2,12,'#e8e6de'],sw:[6,'#e8e6de'],w:25},
    f:"44 keys · 3 oscillators · monophonic · 24 dB ladder filter",
    t:"By the late 1960s Moog's modular systems were expensive and complicated, and Moog and his engineers wanted a fixed, keyboard-based instrument that a musician could carry to a gig. The Minimoog Model D went on sale in 1970. It was a monophonic synth with three oscillators, a 24 dB ladder filter and pitch and modulation wheels, all in a wooden case with a tilted panel. It stayed in production for over a decade.",
    s:"Stacked oscillators through that filter produce a fat, warm bass and a singing lead, and both remain benchmarks. The Minimoog featured in funk, jazz-fusion, prog and early electronic pop, from Parliament-Funkadelic to Emerson, Lake & Palmer, and it helped establish the synthesizer as a real band instrument." },
  { n:"ARP 2600 V", cat:"analog", y:1971, yl:"1971", o:"ARP 2600", m:"ARP Instruments, Massachusetts",
    a:{t:'box',b:'#6f747c',h:190,sl:[20,'#e0a020'],knobs:[1,8,'#1a1a1a']},
    f:"Semi-modular · 3 oscillators · ladder filter · built-in spring reverb",
    h:"Ben Burtt used one for the voice of R2-D2 in Star Wars.",
    t:"Alan R. Pearlman, an engineer who had made operational amplifiers, founded ARP Instruments in 1969. The 2600, released in 1971, was designed with teaching in mind. It is semi-modular, with signal flow printed on the panel and normalled connections so that it works without patch cords, while cords can override the routing. It has three oscillators, a ladder filter, a sample-and-hold and a spring reverb, and it sold to universities as well as studio players.",
    s:"It can do everything from thick basses to sharp percussion and strange effects. Sound designer Ben Burtt built R2-D2's voice with a 2600 for Star Wars (1977), and the instrument became a favourite for sound design in film." },
  { n:"Synthi V", cat:"analog", y:1972, yl:"1972", o:"EMS Synthi AKS", m:"Electronic Music Studios, London",
    a:{t:'synthi'},
    f:"3 oscillators · 16 × 16 pin matrix · touch-sensitive keypad",
    h:"Pink Floyd used the EMS synths on On the Run.",
    t:"Electronic Music Studios was founded in London in 1969 by Peter Zinovieff, Tristram Cary and David Cockerell. The VCS 3 arrived that year: a compact synthesizer that replaced patch cables with a matrix of pins pushed into a grid. The Synthi AKS of 1972 took the VCS 3's circuitry and packed it into a briefcase with a touch-sensitive keypad, making it a portable instrument for the first time.",
    s:"It sounds unstable and organic, with distinctive oscillator and filter behaviour. Pink Floyd used EMS synths for the racing sequence on On the Run (1973), and the VCS 3 and its relatives are closely associated with Brian Eno's early work and with British experimental music of the era." },
  { n:"Buchla Easel V", cat:"analog", y:1973, yl:"1973", o:"Buchla Music Easel", m:"Buchla and Associates, California",
    a:{t:'easel'},
    t:"Don Buchla built his first modular systems in Berkeley in the mid-1960s, independently of Moog and to a different philosophy. He deliberately avoided traditional keyboards and the imitation of acoustic instruments, favouring touch-sensitive plates and complex, evolving waveforms. The Music Easel of 1973 was his portable performance instrument, packing a complex oscillator, envelope generators, a sequencer and touch plates into a small case.",
    s:"The Easel is known for organic, moving sounds and 'West Coast' synthesis, which shapes timbre by folding and warping waveforms rather than by filtering them. It became a tool for experimental composers, and Buchla instruments are associated with artists such as Morton Subotnick and Suzanne Ciani. It is now enjoying a revival." },
  { n:"SEM V", cat:"analog", y:1974, yl:"1974", o:"Oberheim SEM", m:"Tom Oberheim, California",
    a:{t:'box',b:'#2b2b2f',h:110,knobs:[2,8,'#d8d4c6']},
    f:"2 oscillators · 12 dB state-variable filter",
    t:"Tom Oberheim was building effects for other people's synths in the early 1970s when he decided to make a module that would add polyphony to monosynths like the Minimoog. The result, the Synthesizer Expander Module, or SEM, appeared in 1974. It had two oscillators and a 12 dB state-variable filter that could sweep smoothly between low-pass, notch and high-pass. Players began stacking two or four SEMs with a keyboard as the Two-Voice and Four-Voice systems, the first Oberheim polysynths.",
    s:"The SEM's clean, sweet character sounds very different from Moog's aggressive ladder filter. It is prized for pads, sweeps and brass, and its circuitry is at the heart of the later OB-X and OB-Xa." },
  { n:"Prophet-5 V", cat:"analog", y:1978, yl:"1978", o:"Sequential Circuits Prophet-5", m:"Sequential Circuits, California",
    a:{t:'kbd',b:'#151515',c:'#7a4a25',p:'#26262a',ph:88,knobs:[3,13,'#cfcfd4'],sw:[10,'#d9442b'],w:30},
    f:"5 voices · 2 oscillators per voice · program memory",
    t:"Dave Smith co-founded Sequential Circuits in California in 1974. With John Bowen he designed the Prophet-5, released in 1978, the first polyphonic synthesizer to use a microprocessor to store and recall every setting. Before that, polysynths either had few controls or forgot their sounds when you changed a knob. The Prophet-5 offered five voices, two oscillators per voice, a warm analog filter and banks of programs that could be recalled at the press of a button.",
    s:"Being able to recall sounds made it the first polysynth that touring musicians could rely on, and its wide, brassy tone became the sound of the late 1970s and 1980s. Dave Smith later proposed the standard that became MIDI, in 1981, and it was finalised in 1983 to let instruments from different makers talk to each other." },
  { n:"CS-80 V", cat:"analog", y:1977, yl:"1977", o:"Yamaha CS-80", m:"Yamaha",
    a:{t:'kbd',b:'#2a1c14',c:'#6d4630',p:'#131313',ph:92,sl:[22,'#e9e3d0'],w:30},
    f:"8 voices · 2 layers per voice · 61 keys · polyphonic aftertouch",
    h:"Vangelis built the Blade Runner score around it.",
    t:"Yamaha's CS-80 of 1977 was the company's flagship analog synthesizer. It has eight voices, each made of two layers, 61 keys and a weight of roughly 100 kg. Its most important feature is the keyboard: each key responds to both velocity and polyphonic aftertouch, so pressing harder after playing a note shapes that note alone. It is an unusually expressive instrument.",

const R=(x,y,w,h,f,rx=0,s='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}"${s?` stroke="${s}" stroke-width="1"`:''}/>`;
const Ci=(x,y,r,f,s='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${s?` stroke="${s}" stroke-width="1"`:''}/>`;
const Pa=(d,f,s='',sw=1)=>`<path d="${d}" fill="${f}"${s?` stroke="${s}" stroke-width="${sw}"`:''}/>`;
const Li=(x1,y1,x2,y2,s,sw=1)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${sw}" stroke-linecap="round"/>`;
const pr=i=>((i*53+17)%100)/100;
const shadow=(y=284,rx=270)=>`<ellipse cx="320" cy="${y}" rx="${rx}" ry="8" fill="#000" opacity=".15"/>`;

function keys(x,y,w,h,n,rev){

  for(let i=0;i<n-1;i++) if([0,1,3,4,5].includes(i%7)) s+=R(x+(i+1)*kw-kw*0.3,y,kw*0.6,h*0.62,bc,1.5);
  return s;
}
function knobs(x,y,w,h,rows,cols,col){
  let s=''; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const cx=x+(c+0.5)*w/cols, cy=y+(r+0.5)*h/rows;
    s+=Ci(cx,cy,5.5,col,'#00000066')+Li(cx,cy,cx,cy-5,'#000000aa',1.5)+R(cx-6,cy+8.5,12,1.5,'#ffffff44');
  } return s;
}
function sliders(x,y,w,h,n,col){
  let s=''; for(let i=0;i<n;i++){ const sx=x+(i+0.5)*w/n;
    s+=R(sx-1.5,y,3,h,'#000000',1)+R(sx-5,y+pr(i)*(h-8),10,7,col,1.5); } return s;
}
function swt(x,y,w,n,col){
  let s=''; for(let i=0;i<n;i++) s+=R(x+i*(w/n)+1,y,w/n-3,8,col,1.5); return s;
}
function lcd(x,y,w,h,col){
  return R(x,y,w,h,'#0a0a0a',3)+R(x+4,y+4,w-8,h-8,col,2)+R(x+8,y+9,w-24,3,'#00000055')+R(x+8,y+16,w-34,3,'#00000055');
}
function jacks(x,y,n){ let s=''; for(let i=0;i<n;i++) s+=Ci(x+i*16,y,4,'#111','#888'); return s; }

function kbd(a){
  const bx=24,by=64,bw=592,bh=200,cw=a.c?24:6,ph=a.ph||0;
  let s=shadow(a.legs?296:282);
  if(a.legs) s+=Li(130,by+bh,100,292,'#9a9da3',6)+Li(510,by+bh,540,292,'#9a9da3',6)+Li(150,by+bh,500,292,'#9a9da3',4)+Li(490,by+bh,140,292,'#9a9da3',4);
  s+=R(bx,by,bw,bh,a.b,10);
  if(a.c) s+=R(bx,by,cw,bh,a.c,8)+R(bx+bw-cw,by,cw,bh,a.c,8);
  const px=bx+cw+6, pw=bw-2*cw-12;
  if(ph){
    s+=R(px,by+8,pw,ph,a.p,4);
    const ix=px+12, iy=by+16, ih=ph-(a.sw?28:18); let iw=pw-24;
    if(a.lcd){ s+=lcd(px+pw-100,iy,88,Math.min(36,ih),a.lcd); iw-=108; if(a.drive) s+=R(px+pw-100,iy+44,88,7,'#000',2); }
    if(a.joy) s+=Ci(px+pw-56,by+8+ph-24,9,'#cfcfd2','#000')+Ci(px+pw-56,by+8+ph-24,4,'#222');
    if(a.knobs&&a.sl){ const kw=iw*0.58; s+=knobs(ix,iy,kw,ih,...a.knobs)+sliders(ix+kw+12,iy,iw-kw-12,ih,...a.sl); }
    else if(a.knobs) s+=knobs(ix,iy,iw,ih,...a.knobs);
    else if(a.sl) s+=sliders(ix,iy,iw,ih,...a.sl);
    if(a.sw) s+=swt(ix,by+8+ph-16,iw,...a.sw);
    if(a.pj) s+=jacks(ix+4,by+8+ph-16,a.pj);
  }
  s+=keys(bx+cw+6,by+ph+22,bw-2*cw-12,bh-ph-34,a.w||28,a.rev);
  return s;
}
function grand(a){

  s+=R(110,150,462,38,b,8)+Li(120,157,560,157,'#ffffff30',2);
  s+=R(62,160,70,14,'#f3f0e6',2)+R(62,150,70,10,b,2);
  for(let i=0;i<7;i++) s+=R(70+i*9,160,5,9,'#111',1);
  s+=R(150,186,13,86,b,3)+R(500,186,13,86,b,3)+R(84,186,13,86,b,3)+R(118,226,22,6,'#8d8f95',2)+R(122,232,4,30,'#8d8f95',1);
  return s+'</g>';
}

  for(let r=0;r<3;r++){ const y=52+r*58; s+=R(42,y,556,52,'#2a2a2e',3);
    for(let c=0;c<5;c++){ const x0=cols[c], x1=cols[c+1]; if(c>0) s+=Li(x0,y,x0,y+52,'#111',2);
      const n=2+((r+c)%3); for(let k=0;k<n;k++) s+=Ci(x0+(k+0.5)*(x1-x0)/n,y+18,6,'#dcdce0','#000')+Li(x0+(k+0.5)*(x1-x0)/n,y+18,x0+(k+0.5)*(x1-x0)/n,y+12,'#000',1.5);
      for(let j=0;j<3;j++) s+=Ci(x0+14+j*14,y+42,3.5,'#111','#999'); } }
  s+=Pa('M120 76 C170 130 250 20 330 90 S480 150 540 110','none','#e0a020',3);
  s+=Pa('M300 176 C340 200 420 150 470 190','none','#d9442b',3);
  s+=keys(70,240,500,44,30,false);

}
function tb303(){

  for(let i=0;i<6;i++) s+=Ci(120+i*76,150,15,'#2a2a2a','#000')+Li(120+i*76,150,120+i*76,137,'#e8e8e8',2)+R(120+i*76-18,172,36,2,'#00000055');
  for(let i=0;i<13;i++) s+=R(96+i*35,196,26,20,[1,3,6,8,10].includes(i)?'#2a2a2a':'#ececec',2,'#0004');
  for(let i=0;i<16;i++) s+=Ci(98+i*29,228,2.5,i%4==0?'#e04a3a':'#666');

function easel(){

function box(a){
  const h=a.h||120, y=(300-h)/2, x=50, w=540;
  let s=shadow(y+h+12,250)+R(x,y,w,h,a.b,5)+R(x-14,y,14,h,'#8d9096',2)+R(x+w,y,14,h,'#8d9096',2);

const ART={kbd,grand,modular,tb303,synthi,easel,box,ws,organ,mello,ui};
function art(d){ return `<svg viewBox="0 0 640 300" role="img" aria-label="Illustration of the ${d.o}">${(OVR[d.n]||ART[d.a.t])(d.a)}</svg>`; }

// ---------- app ----------
const state = { cat: "all", sort: "type", q: "", open: new Set() };
const $ = s => document.querySelector(s);
const list = $("#list"), countEl = $("#count");
const idOf = d => "i-" + d.n.replace(/[^a-z0-9]/gi, "").toLowerCase();

const chipsEl = $("#chips");
const chipDefs = [["all","All"], ...Object.entries(CATS).map(([k,v]) => [k, v.label])];
chipsEl.innerHTML = chipDefs.map(([k,l]) => `<button type="button" class="chip" data-cat="${k}" aria-pressed="${k==='all'}">${l}</button>`).join("");

function bodyHTML(d) {
  const q = encodeURIComponent(d.o.replace(/\(.*?\)/g,'') + " " + d.m + " photo");
  return `<figure class="fig">${art(d)}<figcaption>Illustration of the original, not a photograph.</figcaption></figure>
    <p>${d.t}</p>
    <p>${d.s}</p>
    ${d.f ? `<p class="facts">${d.f}</p>` : ''}
    ${d.h ? `<p class="heard">${d.h}</p>` : ''}
    <p class="links"><a href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener noreferrer">Search for photos of the original</a></p>`;
}

function itemHTML(d) {
  const id = idOf(d), open = state.open.has(id);
  return `<article class="item" data-cat="${d.cat}">
    <button class="head" aria-expanded="${open}" aria-controls="${id}" data-id="${id}">
      <span class="year${d.small || d.yl.length > 5 ? ' small' : ''}">${d.yl}</span>
      <span><span class="name">${d.n}</span><span class="orig">${d.o} · ${d.m}</span></span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="body${open ? ' open' : ''}" id="${id}" role="region" aria-label="${d.n} history"><div>${open ? bodyHTML(d) : ''}</div></div>
  </article>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  let items = DATA.filter(d =>
    (state.cat === "all" || d.cat === state.cat) &&
    (!q || (d.n + " " + d.o + " " + d.m + " " + d.yl + " " + d.t + " " + d.s).toLowerCase().includes(q))
  );
  countEl.textContent = items.length === 1 ? "1 instrument" : items.length + " instruments";
  if (!items.length) { list.innerHTML = `<p class="empty">Nothing matches that search. Clear it or pick a different group.</p>`; return; }
  if (state.sort === "year") {
    items = items.slice().sort((a,b) => a.y - b.y);
    list.innerHTML = items.map(itemHTML).join("");
  } else {
    let html = "";
    for (const [k, c] of Object.entries(CATS)) {
      const g = items.filter(d => d.cat === k).sort((a,b) => a.y - b.y);
      if (!g.length) continue;
      html += `<h2 class="group-title">${c.label}</h2><p class="group-note">${c.note}</p>` + g.map(itemHTML).join("");
    }
    list.innerHTML = html;
  }
}

list.addEventListener("click", e => {
  const btn = e.target.closest(".head");
  if (!btn) return;
  const id = btn.dataset.id, body = document.getElementById(id);
  const willOpen = !body.classList.contains("open");
  if (willOpen && !body.firstElementChild.firstElementChild) {
    body.firstElementChild.innerHTML = bodyHTML(DATA.find(d => idOf(d) === id));
  }
  body.classList.toggle("open", willOpen);
  btn.setAttribute("aria-expanded", willOpen);
  willOpen ? state.open.add(id) : state.open.delete(id);
});
chipsEl.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.cat = b.dataset.cat;
  chipsEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  render();
});
$("#sort").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.sort = b.dataset.sort;
  $("#sort").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
render();
